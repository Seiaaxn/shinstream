name: Code Quality

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check for console.log statements
        run: |
          echo "## Console Statement Check" >> $GITHUB_STEP_SUMMARY
          count=$(grep -rn "console\." --include="*.js" --exclude-dir=node_modules --exclude-dir=api/node_modules | grep -v "// allowed" | wc -l) || true
          echo "Found $count console statements (migrate to logger service)" >> $GITHUB_STEP_SUMMARY
          if [ "$count" -gt 150 ]; then
            echo "::warning::High number of console statements found: $count"
          fi
      
      - name: Check file sizes
        run: |
          echo "## Large Files Check" >> $GITHUB_STEP_SUMMARY
          find . -name "*.js" -not -path "./node_modules/*" -not -path "./api/node_modules/*" -exec wc -l {} \; | sort -n | tail -5 >> $GITHUB_STEP_SUMMARY
      
      - name: Dependency size check
        run: |
          echo "## Dependency Check" >> $GITHUB_STEP_SUMMARY
          du -sh node_modules >> $GITHUB_STEP_SUMMARY

  lighthouse:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          echo "Lighthouse CI ready for configuration"
          
